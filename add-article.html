<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إضافة مقال</title><style>body{font-family:Tahoma;background:#f8f5ec;color:#17352d;line-height:1.8}.wrap{max-width:760px;margin:25px auto;width:92%}.panel{background:white;padding:24px;border-radius:14px}label{display:block;margin-top:12px}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;font:inherit;border:1px solid #d7d0bf;border-radius:8px}textarea{min-height:170px}button{margin-top:14px;padding:12px 18px;background:#063b2e;color:white;border:0;border-radius:8px;font:inherit}</style><main class="wrap"><div class="panel"><h1>إضافة مقال جديد</h1><p>اكتب المقال ثم نزّل ملف articles.json وارفعه إلى GitHub بدل الملف القديم؛ سيظهر المقال في الموقع بعد التحديث.</p><form id="f"><label>عنوان المقال</label><input id="t" required><label>التصنيف</label><select id="cat"><option>التفسير</option><option>الحديث</option><option>العقيدة</option><option>اللغة العربية</option><option>فوائد وتقييدات</option><option>أخرى</option></select><label>ملخص قصير</label><textarea id="sum" style="min-height:70px"></textarea><label>نص المقال</label><textarea id="c" required></textarea><label>التاريخ</label><input id="d" type="date"><button>تنزيل articles.json</button></form><p>ملاحظة: هذه الأداة تجهز الملف فقط؛ يلزم رفعه إلى مستودع الموقع حتى يراه الزوار.</p></div></main><script>let posts=[];fetch('articles.json').then(r=>r.json()).then(x=>posts=x).catch(()=>{});document.getElementById('f').onsubmit=e=>{e.preventDefault();posts.push({id:Date.now().toString(36),title:t.value,category:cat.value,summary:sum.value,content:c.value,date:d.value||new Date().toISOString().slice(0,10)});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(posts,null,2)],{type:'application/json'}));a.download='articles.json';a.click()};</script></html>

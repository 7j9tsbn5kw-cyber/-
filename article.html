<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المقال | محمد أحمد سوغو</title><style>body{font-family:Tahoma,Arial;background:#f8f5ec;color:#17352d;line-height:2;margin:0}.bar{background:#063b2e;color:white;padding:20px}.paper{background:white;max-width:850px;width:90%;margin:25px auto;padding:28px;border-radius:14px;white-space:pre-wrap}h1{color:#063b2e}</style><header class="bar">محمد أحمد سوغو الوداني · المدونة العلمية</header><article class="paper" id="post">جارٍ تحميل المقال…</article><script>const id=new URLSearchParams(location.search).get('id');fetch('articles.json').then(r=>r.json()).then(ps=>{const p=ps.find(x=>x.id===id),e=document.getElementById('post');e.textContent='';if(!p){e.textContent='المقال غير موجود';return}const h=document.createElement('h1');h.textContent=p.title;const m=document.createElement('p');m.textContent=(p.category||'')+' · '+(p.date||'');const c=document.createElement('div');c.textContent=p.content||'';e.append(h,m,c)});</script><p style="text-align:center"><a href="index.html#published-articles">العودة إلى المقالات</a></p></html>
